name: Publicar en PyPI y en el registro MCP

# Publicación sin tokens (Trusted Publishing + OIDC). Requiere registrar antes el
# "pending publisher" en https://pypi.org/manage/account/publishing/ con:
#   proyecto: verifactu-qr | owner: caseroclaw | repo: verifactu-qr
#   workflow: publish.yml  | entorno: pypi
# Después: git tag v0.1.0 && git push origin v0.1.0
#
# El segundo trabajo publica la ficha en el registro oficial de servidores MCP
# (registry.modelcontextprotocol.io) autenticando por OIDC del propio workflow,
# así que no necesita ningún secreto. La ficha solo se acepta cuando el paquete
# ya existe en PyPI y su README contiene "mcp-name: io.github.caseroclaw/verifactu-qr".

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: PYTHONPATH=src python -m unittest discover -s tests
      - run: python -m pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1

  mcp-registry:
    # Depende de PyPI: el registro verifica que el paquete publicado exista.
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC: el registro confía en la identidad del workflow
    steps:
      - uses: actions/checkout@v4

      - name: Alinear la versión de server.json con el tag
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=$VERSION" >> "$GITHUB_ENV"
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > server.tmp
          mv server.tmp server.json

      - name: Instalar mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Autenticar por OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publicar la ficha en el registro MCP
        run: ./mcp-publisher publish
