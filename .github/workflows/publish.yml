name: Publicar en PyPI

# Publicación sin tokens (Trusted Publishing). Requiere registrar antes el
# "pending publisher" en https://pypi.org/manage/account/publishing/ con:
#   proyecto: verifactu-qr | owner: caseroclaw | repo: verifactu-qr
#   workflow: publish.yml  | entorno: pypi
# Después: git tag v0.1.0 && git push origin v0.1.0

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: PYTHONPATH=src python -m unittest discover -s tests
      - run: python -m pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
