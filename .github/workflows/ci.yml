name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: CLI de ejemplo
        run: PYTHONPATH=src python -m verifactu_qr.cli qr --nif 89890001K --numserie "12345678&G33" --fecha 01-01-2024 --importe 241.4 --pruebas
